<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>HP Gas CDCMS Blocker</title>
  <style>
    body {
      width: 330px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      padding: 16px;
      color: #1e293b;
      background: #f8fafc;
      box-sizing: border-box;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 12px;
      border-bottom: 1px solid #e2e8f0;
      padding-bottom: 10px;
    }
    .logo {
      width: 36px;
      height: 36px;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
    }
    .header-text h2 {
      font-size: 14px;
      margin: 0;
      color: #0f172a;
      font-weight: 700;
    }
    .header-text .sub {
      font-size: 11px;
      color: #0284c7;
      font-weight: 600;
    }
    .license-badge {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 10px;
      border-radius: 8px;
      font-size: 11.5px;
      font-weight: 600;
      margin-bottom: 12px;
    }
    .license-active {
      background: #ecfdf5;
      color: #065f46;
      border: 1px solid #a7f3d0;
    }
    .license-locked {
      background: #fef2f2;
      color: #991b1b;
      border: 1px solid #fecaca;
    }
    .btn {
      width: 100%;
      background: #0284c7;
      color: white;
      border: none;
      padding: 9px;
      border-radius: 6px;
      font-weight: 600;
      font-size: 12.5px;
      cursor: pointer;
      text-align: center;
      transition: background 0.2s;
    }
    .btn:hover {
      background: #0369a1;
    }
    .lic-input-group {
      display: flex;
      gap: 6px;
      margin-bottom: 10px;
    }
    .lic-input {
      flex: 1;
      padding: 8px;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      font-size: 12px;
      font-family: monospace;
      outline: none;
    }
    .lic-input:focus {
      border-color: #0284c7;
    }
    .btn-activate {
      background: #16a34a;
      color: white;
      border: none;
      padding: 0 12px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
    }
    .btn-activate:hover {
      background: #15803d;
    }
    #status-msg {
      font-size: 11px;
      color: #059669;
      margin-top: 6px;
      text-align: center;
      min-height: 16px;
    }
    .dev-card {
      margin-top: 14px;
      padding: 10px 8px;
      background: #021a10;
      border-radius: 8px;
      border: 1px solid #064e3b;
      text-align: center;
    }
    .dev-badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      background: rgba(6, 78, 59, 0.6);
      border: 1px solid #10b981;
      color: #34d399;
      font-size: 11px;
      font-weight: 600;
      padding: 3px 10px;
      border-radius: 20px;
    }
    .contact-pills {
      display: flex;
      gap: 6px;
      margin-top: 8px;
      justify-content: center;
    }
    .pill {
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 10px;
      font-weight: 600;
      padding: 4px 8px;
      border-radius: 16px;
    }
    .pill-wa {
      background: rgba(16, 185, 129, 0.15);
      border: 1px solid #059669;
      color: #34d399;
    }
    .pill-mail {
      background: rgba(59, 130, 246, 0.15);
      border: 1px solid #2563eb;
      color: #93c5fd;
    }
  </style>
</head>
<body>
  <div class="header">
    <img src="icons/icon48.png" alt="RS" class="logo">
    <div class="header-text">
      <h2>HP Gas CDCMS Blocker</h2>
      <div class="sub">ScreenCode CM-16 Automation</div>
    </div>
  </div>

  <!-- License Status Box -->
  <div id="license-box" class="license-badge license-locked">
    <span id="lic-status-text">🔒 Checking License...</span>
    <span id="lic-badge-tag" style="font-size: 10px; background: rgba(0,0,0,0.1); padding: 2px 6px; border-radius: 4px;">LOCKED</span>
  </div>

  <!-- Quick Activation Form (Shown if not activated) -->
  <div id="activation-form" style="display: none; margin-bottom: 12px;">
    <div class="lic-input-group">
      <input type="text" id="popup-lic-key" class="lic-input" placeholder="Paste License Key (RS-...)">
      <button id="popup-activate-btn" class="btn-activate">Activate</button>
    </div>
  </div>

  <button id="open-panel-btn" class="btn">👉 Open Blocker Panel on Screen</button>
  <div id="status-msg"></div>

  <div class="dev-card">
    <div class="dev-badge">
      <span>👤</span> Developed by <strong>Mr. Rahul Script</strong>
    </div>
    <div style="font-size: 9.5px; color: #a7f3d0; margin-top: 5px; line-height: 1.3;">
      Official Copyright & Technical Support • Business Automation Solutions
    </div>
    <div class="contact-pills">
      <a href="https://wa.me/917564948617" target="_blank" class="pill pill-wa">
        💬 WhatsApp: +917564948617
      </a>
      <a href="mailto:life.rahulg@gmail.com" class="pill pill-mail">
        ✉ Email
      </a>
    </div>
  </div>

  <script src="license.js"></script>
  <script src="popup.js"></script>
</body>
</html>
